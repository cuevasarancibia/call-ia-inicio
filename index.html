    <script>
      tailwind.config = {
        darkMode: 'class',

              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out',

            keyframes: {
              fadeIn: {

              },

                 '50%': { opacity: '0.7' },
              },
              glow: {
                '0%, 100%': { textShadow: '0 0 10px rgba(255,255,255,0.05)', filter: 'brightness(1)' },
